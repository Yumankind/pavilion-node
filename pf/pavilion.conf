pass in quick inet proto tcp from $job_v4 to <job_gateways> port 47100:47199 keep state
# Everything else from a job VM: this Mac's other services, its LAN address, anything forwarded.
block drop in quick inet from $job_v4 to any
# Job VMs' IPv6. Every VM has a link-local address (fe80::) and can reach this Mac's own link-local and unique-local
# addresses on its bridge, which IPv4 rules don't cover, and "to self" can't either (it is fixed when the rule loads).
# So: nothing over IPv6 from a VM bridge to this Mac's local addresses (security audit 23 Nov 2026 #5). Apple's
# container networks are bridge100 and up (bridge0 is Thunderbolt). VMs have no IPv6 default route, so global
# addresses aren't reachable. Other VMs on these bridges lose IPv6 to this Mac too, nothing else.
job_bridges = "{ bridge100 bridge101 bridge102 bridge103 bridge104 bridge105 bridge106 bridge107 bridge108 bridge109 bridge110 bridge111 bridge112 bridge113 bridge114 bridge115 bridge116 bridge117 bridge118 bridge119 bridge120 bridge121 bridge122 bridge123 bridge124 bridge125 bridge126 bridge127 bridge128 bridge129 bridge130 bridge131 bridge132 bridge133 bridge134 bridge135 bridge136 bridge137 bridge138 bridge139 bridge140 bridge141 bridge142 bridge143 bridge144 bridge145 bridge146 bridge147 bridge148 bridge149 bridge150 bridge151 bridge152 bridge153 bridge154 bridge155 bridge156 bridge157 bridge158 bridge159 bridge160 bridge161 bridge162 bridge163 }"
block drop in quick on $job_bridges inet6 to { fe80::/10, fd00::/8, ff00::/8, ::1 }
block drop in quick inet6 from fd00::/8 to self
