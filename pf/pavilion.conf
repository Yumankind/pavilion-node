# Cloud Pavilion: job VMs may reach ONLY the node's brokers on this Mac (docs/MACHINES.md §12, finding 3).
# Every job gets its own host-only network in 10.89.0.0/16; brokers listen on 47100-47199.
# Without this, a VM can reach any service on this Mac that listens on all interfaces
# (a dev server serving files, Screen Sharing, AirPlay, rapportd), and the Mac's LAN address.
#
# Load (macOS already evaluates anchors under com.apple/*):
#   sudo node/pf/install.sh   (loads it and keeps it across restarts; `remove` to undo)
# Check:   sudo pfctl -a com.apple/pavilion -sr
# Remove:  sudo pfctl -a com.apple/pavilion -F rules

job_v4 = "10.89.0.0/16"

# The broker, on the job's own gateway address (10.89.x.1). Not "to self": pf expands that to the addresses this Mac
# has when the rule loads, and a job's gateway only exists once its VM starts. Gateways only, not the whole range, so a
# job VM can't reach another job's VM on these ports (security audit 23 Nov 2026 #11).
table <job_gateways> const { 10.89.0.1, 10.89.1.1, 10.89.2.1, 10.89.3.1, 10.89.4.1, 10.89.5.1, 10.89.6.1, 10.89.7.1, 10.89.8.1, 10.89.9.1, 10.89.10.1, 10.89.11.1, 10.89.12.1, 10.89.13.1, 10.89.14.1, 10.89.15.1, 10.89.16.1, 10.89.17.1, 10.89.18.1, 10.89.19.1, 10.89.20.1, 10.89.21.1, 10.89.22.1, 10.89.23.1, 10.89.24.1, 10.89.25.1, 10.89.26.1, 10.89.27.1, 10.89.28.1, 10.89.29.1, 10.89.30.1, 10.89.31.1, 10.89.32.1, 10.89.33.1, 10.89.34.1, 10.89.35.1, 10.89.36.1, 10.89.37.1, 10.89.38.1, 10.89.39.1, 10.89.40.1, 10.89.41.1, 10.89.42.1, 10.89.43.1, 10.89.44.1, 10.89.45.1, 10.89.46.1, 10.89.47.1, 10.89.48.1, 10.89.49.1, 10.89.50.1, 10.89.51.1, 10.89.52.1, 10.89.53.1, 10.89.54.1, 10.89.55.1, 10.89.56.1, 10.89.57.1, 10.89.58.1, 10.89.59.1, 10.89.60.1, 10.89.61.1, 10.89.62.1, 10.89.63.1, 10.89.64.1, 10.89.65.1, 10.89.66.1, 10.89.67.1, 10.89.68.1, 10.89.69.1, 10.89.70.1, 10.89.71.1, 10.89.72.1, 10.89.73.1, 10.89.74.1, 10.89.75.1, 10.89.76.1, 10.89.77.1, 10.89.78.1, 10.89.79.1, 10.89.80.1, 10.89.81.1, 10.89.82.1, 10.89.83.1, 10.89.84.1, 10.89.85.1, 10.89.86.1, 10.89.87.1, 10.89.88.1, 10.89.89.1, 10.89.90.1, 10.89.91.1, 10.89.92.1, 10.89.93.1, 10.89.94.1, 10.89.95.1, 10.89.96.1, 10.89.97.1, 10.89.98.1, 10.89.99.1, 10.89.100.1, 10.89.101.1, 10.89.102.1, 10.89.103.1, 10.89.104.1, 10.89.105.1, 10.89.106.1, 10.89.107.1, 10.89.108.1, 10.89.109.1, 10.89.110.1, 10.89.111.1, 10.89.112.1, 10.89.113.1, 10.89.114.1, 10.89.115.1, 10.89.116.1, 10.89.117.1, 10.89.118.1, 10.89.119.1, 10.89.120.1, 10.89.121.1, 10.89.122.1, 10.89.123.1, 10.89.124.1, 10.89.125.1, 10.89.126.1, 10.89.127.1, 10.89.128.1, 10.89.129.1, 10.89.130.1, 10.89.131.1, 10.89.132.1, 10.89.133.1, 10.89.134.1, 10.89.135.1, 10.89.136.1, 10.89.137.1, 10.89.138.1, 10.89.139.1, 10.89.140.1, 10.89.141.1, 10.89.142.1, 10.89.143.1, 10.89.144.1, 10.89.145.1, 10.89.146.1, 10.89.147.1, 10.89.148.1, 10.89.149.1, 10.89.150.1, 10.89.151.1, 10.89.152.1, 10.89.153.1, 10.89.154.1, 10.89.155.1, 10.89.156.1, 10.89.157.1, 10.89.158.1, 10.89.159.1, 1