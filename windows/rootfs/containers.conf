# Rootless Podman in pavilion-node's WSL distro. Each job sets its own memory, CPUs and processes; systemd hands the
# cgroups to the pavilion user (delegate.conf). gVisor is registered for jobs; plain crun is refused by the node.
[engine]
cgroup_manager = "systemd"
events_logger = "file"

[engine.runtimes]
runsc = ["/usr/bin/runsc"]

[network]
default_rootless_network_cmd = "pasta"
