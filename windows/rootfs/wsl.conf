# pavilion-node's WSL distro (node/src/sandbox/wsl.rs): it runs job sandboxes and gets nothing from Windows.
[boot]
systemd=true
[user]
default=pavilion
[interop]
enabled=false
appendWindowsPath=false
[automount]
enabled=false
mountFsTab=false
[network]
generateHosts=true
generateResolvConf=true
hostname=pavilion
