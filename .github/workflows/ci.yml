name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks CLI (free); the gitleaks GitHub Action needs a paid licence for organisation repositories.
      - run: docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose --config /repo/.gitleaks.toml
